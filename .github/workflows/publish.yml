# Publishes to npm through trusted publishing (OIDC): no token in the repo.
# One-time setup on npmjs.com: package settings -> Trusted publisher -> GitHub Actions,
# organization/user "xoomar-dev", repository "xoomar-js", workflow "publish.yml".
name: publish
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance --access public
